[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evolutionary_math"
version = "0.1.0"
description = "Autonomous mathematical discovery engine using evolutionary algorithms and deterministic verification"
authors = [{ name = "Evolutionary Math Research Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "mpmath>=1.3.0",
    "pydantic>=2.0",
]

[project.scripts]
evolutionary-math = "evolutionary_math.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

